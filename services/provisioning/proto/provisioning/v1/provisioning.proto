syntax = "proto3";

package provisioning.v1;

option go_package = "github.com/mtk14m/notilius/proto/provisioning/v1;provisioning";

// ===== SERVICES (RPC endpoints) =====
service ProvisioningService {
  rpc CreateNamespace(CreateNamespaceRequest) returns (CreateNamespaceResponse);
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (DeleteNamespaceResponse);
  rpc GetNamespaceStatus(GetNamespaceStatusRequest) returns (GetNamespaceStatusResponse);
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
}

// ===== REQUEST/RESPONSE Messages =====

message CreateNamespaceRequest {
  string namespace = 1;
  map<string, string> labels = 2;
  string owner_id = 3;
  string owner_email = 4;
  ResourceQuota quota = 5;
}

message CreateNamespaceResponse {
  bool success = 1;
  string message = 2;
  string namespace = 3;
  string resource_version = 4;
  NamespaceMetadata metadata = 5;
}

message DeleteNamespaceRequest {
  string namespace = 1;
  string owner_id = 2;
  int32 grace_period_seconds = 3;
}

message DeleteNamespaceResponse {
  bool success = 1;
  string message = 2;
}

message GetNamespaceStatusRequest {
  string namespace = 1;
}

message GetNamespaceStatusResponse {
  string namespace = 1;
  string phase = 2;
  int32 pod_count = 3;
  int32 running_pods = 4;
  int32 failed_pods = 5;
  ResourceUsage resource_usage = 6;
  int64 created_at_unix = 7;
  int64 updated_at_unix = 8;
}

message ListNamespacesRequest {
  string owner_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListNamespacesResponse {
  repeated NamespaceInfo namespaces = 1;
  int32 total = 2;
}

message NamespaceMetadata {
  string uid = 1;
  string name = 2;
  map<string, string> labels = 3;
  map<string, string> annotations = 4;
  int64 created_timestamp = 5;
}

message ResourceQuota {
  int32 cpu_limit = 1;
  int32 memory_limit = 2;
  int32 pod_limit = 3;
}

message ResourceUsage {
  int32 cpu_millis = 1;
  int32 memory_mb = 2;
}

message NamespaceInfo {
  string namespace = 1;
  string phase = 2;
  string owner_id = 3;
  int64 created_at_unix = 4;
}

message ErrorDetail {
  string code = 1;
  string message = 2;
}